<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocSearch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url('https://i.pinimg.com/originals/84/82/79/8482794f5f72ab497bec84be9ef541c9.jpg?nii=t');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 20px;
        }

        .msg .timing {
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.4;
            text-align: right;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
            display: block !important;
            font-family: monospace;
            font-size: 11px;
        }

        .background {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                rgba(255, 69, 0, 0.15) 0%, 
                rgba(255, 140, 0, 0.08) 50%, 
                transparent 100%);
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 980px;
            height: 78vh;
            max-height: 600px;
            background: rgba(35, 35, 35, 0.28);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 48px;
            padding: 40px 50px 30px;
            box-shadow: 0 25px 70px rgba(0,0,0,.45), 0 0 40px rgba(255,140,0,.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .logo {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ffffff, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .clear-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 22px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
            z-index: 10;
            line-height: 1;
        }

        .clear-btn:hover {
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.06);
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            text-align: left;
            padding: 10px 6px;
            margin: 12px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg {
            padding: 14px 20px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 17px;
            line-height: 1.5;
            animation: fadeIn 0.25s ease;
        }

        .msg.user {
            background: rgba(255, 140, 0, 0.3);
            align-self: flex-end;
            margin-left: auto;
        }

        .msg.bot {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
        }

        .msg .sources {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.6;
        }

        .input-container {
            display: flex;
            gap: 14px;
            margin-top: auto;
            padding-top: 10px;
        }

        input {
            flex: 1;
            padding: 16px 24px;
            font-size: 17px;
            height: 62px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: white;
            outline: none;
            autocomplete: off;
            -webkit-autofill: none;
            -webkit-box-shadow: 0 0 0 1000px rgba(0,0,0,0.3) inset !important;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.3) inset !important;
        }

        input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        button {
            padding: 18px 44px;
            font-size: 18px;
            font-weight: 500;
            background: rgba(255, 140, 0, 0.9);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background: #ff8c00;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 12px;
            font-size: 16px;
            opacity: 0.35;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat::-webkit-scrollbar {
            width: 4px;
        }
        .chat::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                overflow: hidden;
                height: 100vh;
                height: 100dvh;
                background-image: url('https://i.pinimg.com/1200x/19/80/cd/1980cd2f05ca1aac3e02d569221649af.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }

            .card {
                padding: 24px 20px 18px;
                border-radius: 32px;
                height: 92vh;
                height: 92dvh;
                max-height: none;
                max-width: 100%;
            }

            .logo {
                font-size: 28px;
                margin-bottom: 12px;
                text-align: center;
            }

            .clear-btn {
                top: 20px;
                right: 24px;
                font-size: 20px;
                padding: 4px 8px;
            }

            .msg {
                font-size: 15px;
                padding: 12px 16px;
                max-width: 92%;
            }

            .input-container {
                gap: 10px;
            }

            input {
                font-size: 16px;
                height: 50px;
                padding: 12px 18px;
            }

            button {
                padding: 14px 24px;
                font-size: 16px;
                min-width: 80px;
            }

            .footer {
                font-size: 12px;
                margin-top: 8px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 6px;
                background-image: url('https://i.pinimg.com/1200x/19/80/cd/1980cd2f05ca1aac3e02d569221649af.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }

            .card {
                padding: 18px 14px 14px;
                border-radius: 24px;
                height: 94vh;
                height: 94dvh;
            }

            .logo {
                font-size: 22px;
                margin-bottom: 10px;
                text-align: center;
            }

            .clear-btn {
                top: 14px;
                right: 18px;
                font-size: 18px;
                padding: 4px 6px;
            }

            .msg {
                font-size: 14px;
                padding: 10px 14px;
                max-width: 95%;
            }

            .input-container {
                gap: 8px;
                flex-wrap: wrap;
            }

            input {
                flex: 1 1 100%;
                height: 44px;
                font-size: 15px;
                padding: 10px 16px;
            }

            button {
                flex: 1;
                padding: 12px 16px;
                font-size: 15px;
                min-width: 60px;
            }

            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="card">
        <div class="logo">DocSearch</div>

        <button class="clear-btn" id="clearBtn" title="Очистить чат">⟲</button>

        <div class="chat" id="chat">
            <div class="msg bot">
                Добро пожаловать, сотрудник СерчИнформ!
                <br><br>
                Я помогу найти информацию в документации.
                <br><br>
                Просто задайте вопрос, и я найду ответ среди загруженных документов.
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="question" placeholder="Напиши свой вопрос..." autocomplete="off">
            <button id="sendBtn">Отправить</button>
        </div>

        <div class="footer">DOCSEARCH — твой локальный RAG</div>
    </div>

    <script>
    const token = localStorage.getItem('token');
    const user = localStorage.getItem('user');
    const USER = user || 'Валерия';

    console.log('Пользователь:', USER);

    const chat = document.getElementById('chat');
    const input = document.getElementById('question');
    const btn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');

    let isProcessing = false;
    let abortController = null;  

    clearBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('Очистить историю чата?')) {
            const welcome = chat.querySelector('.msg.bot');
            chat.innerHTML = '';
            if (welcome) {
                chat.appendChild(welcome);
            } else {
                const msg = document.createElement('div');
                msg.className = 'msg bot';
                msg.innerHTML = 'Добро пожаловать!<br><br>Задайте вопрос, и я помогу найти информацию.';
                chat.appendChild(msg);
            }
            console.log('Чат очищен');
        }
    });

    function addMessage(text, isUser, sources, timings) {
        const msg = document.createElement('div');
        msg.className = `msg ${isUser ? 'user' : 'bot'}`;

        const contentWrapper = document.createElement('div');
        contentWrapper.style.display = 'flex';
        contentWrapper.style.alignItems = 'flex-start';
        contentWrapper.style.justifyContent = 'space-between';
        contentWrapper.style.width = '100%';
        contentWrapper.style.gap = '10px';

        const textDiv = document.createElement('div');
        textDiv.textContent = text;
        textDiv.style.flex = '1';
        textDiv.style.wordBreak = 'break-word';
        contentWrapper.appendChild(textDiv);

        if (!isUser && text && text.length > 0) {
            const copyBtn = document.createElement('button');
            copyBtn.style.background = 'none';
            copyBtn.style.border = 'none';
            copyBtn.style.cursor = 'pointer';
            copyBtn.style.padding = '4px';
            copyBtn.style.flexShrink = '0';
            copyBtn.style.borderRadius = '4px';
            copyBtn.style.display = 'flex';
            copyBtn.style.alignItems = 'center';
            copyBtn.style.justifyContent = 'center';
            copyBtn.style.width = '28px';      
            copyBtn.style.height = '28px';     
            copyBtn.style.transition = 'background-color 0.2s'; 
            copyBtn.style.opacity = '1'; 
            copyBtn.title = 'Копировать ответ';

            copyBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            `;

            copyBtn.onclick = function(e) {
                e.stopPropagation();
                copyToClipboard(text, copyBtn);
            };

            copyBtn.onmouseenter = function() {
                copyBtn.style.backgroundColor = 'rgba(255,255,255,0.1)';
                copyBtn.querySelector('svg').setAttribute('stroke', 'rgba(255,255,255,0.9)');
            };
            copyBtn.onmouseleave = function() {
                copyBtn.style.backgroundColor = 'transparent';
                if (copyBtn.querySelector('svg').getAttribute('stroke') !== 'rgba(255, 255, 0, 0.6)') {
                    copyBtn.querySelector('svg').setAttribute('stroke', 'rgba(255,255,255,0.6)');
                }
            };

            contentWrapper.appendChild(copyBtn);
        }
        msg.appendChild(contentWrapper);

        if (sources && sources.length) {
            const src = document.createElement('div');
            src.className = 'sources';
            const names = sources.map(s => s.doc_id).join(', ');
            src.textContent = `Источники: ${names}`;
            msg.appendChild(src);
        }

        if (!isUser && timings && timings.total !== undefined) {
            const timeDiv = document.createElement('div');
            timeDiv.className = 'timing';
            timeDiv.style.fontSize = '12px';
            timeDiv.style.opacity = '0.5';
            timeDiv.style.marginTop = '6px';
            timeDiv.style.borderTop = '1px solid rgba(255,255,255,0.05)';
            timeDiv.style.paddingTop = '6px';
            timeDiv.style.whiteSpace = 'pre-line';
            timeDiv.style.fontFamily = 'monospace';
            timeDiv.style.fontSize = '11px';

            const total = timings.total ? timings.total.toFixed(2) : '0.00';
            const embed = timings.embed ? timings.embed.toFixed(2) : '0.00';
            const search = timings.search ? timings.search.toFixed(2) : '0.00';
            const llm = timings.llm ? timings.llm.toFixed(2) : '0.00';

            let text = `Общее время: ${total} сек\n`;
            text += `── Эмбеддинг: ${embed} сек\n`;
            text += `── Поиск: ${search} сек\n`;
            text += `── LLM: ${llm} сек`;

            timeDiv.textContent = text;
            msg.appendChild(timeDiv);
        }

        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    function copyToClipboard(text, button) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => {
                   
                    button.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 6L9 17L4 12" stroke="rgba(255, 255, 0, 0.6)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    `;
                    setTimeout(() => {
                       
                        button.innerHTML = `
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        `;
                    }, 1500);
                    console.log('Ответ скопирован');
                })
                .catch(err => {
                    console.error('Ошибка копирования:', err);
                    fallbackCopy(text, button);
                });
        } else {
            fallbackCopy(text, button);
        }
    }

    function fallbackCopy(text, button) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
           
            button.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 6L9 17L4 12" stroke="rgba(255, 255, 0, 0.6)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            `;
            setTimeout(() => {
                button.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                `;
            }, 1500);
            console.log('Ответ скопирован (fallback)');
        } catch (err) {
            console.error('Ошибка копирования:', err);
        }
        document.body.removeChild(textarea);
    }

    function createStopButton() {
        const stopBtn = document.createElement('button');
        stopBtn.id = 'stopBtn';
        stopBtn.textContent = 'Пауза';
        stopBtn.style.background = 'rgba(255, 50, 50, 0.8)';
        stopBtn.style.marginLeft = '10px';
        stopBtn.onclick = function(e) {
            e.preventDefault();
            stopSearch();
        };
        return stopBtn;
    }

    function stopSearch() {
        if (abortController) {
            abortController.abort();  
            abortController = null;
        }
        isProcessing = false;
        
        const stopBtn = document.getElementById('stopBtn');
        if (stopBtn) stopBtn.remove();


        btn.style.display = 'inline-block';
        btn.disabled = false;
        btn.textContent = 'Отправить';
        input.disabled = false;
        input.placeholder = 'Напиши свой вопрос...';
        input.focus();

        const waits = chat.querySelectorAll('.msg.bot');
        for (const w of waits) {
            if (w.textContent.includes('Ищу ответ')) {
                w.remove();
            }
        }

        addMessage('Поиск остановлен пользователем.', false);
        console.log("Поиск остановлен");
    }

    function sendQuestion() {
        if (isProcessing) {
            console.log("Уже идет поиск...");
            return;
        }

        const q = input.value.trim();
        if (!q) return;

        isProcessing = true;
        input.disabled = true;
        input.placeholder = 'Подождите...';

        btn.style.display = 'none';

        const stopBtn = createStopButton();
        const container = document.querySelector('.input-container');
        container.appendChild(stopBtn);

        addMessage(q, true);
        input.value = '';

        const wait = document.createElement('div');
        wait.className = 'msg bot';
        wait.textContent = 'Ищу';
        wait.style.opacity = '0.6';
        chat.appendChild(wait);
        chat.scrollTop = chat.scrollHeight;

        abortController = new AbortController();

        fetch('/ask', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            },
            body: JSON.stringify({ query: q }),
            signal: abortController.signal  
        })
        .then(res => res.json())
        .then(data => {
            console.log("Ответ от сервера:", data);
            wait.remove();
            
            if (data.answer) {
                addMessage(data.answer, false, data.sources || [], data.timings);
            } else {
                addMessage('В документации такой информации не найдено.', false);
            }
        })
        .catch(e => {
           
            if (e.name !== 'AbortError') {
                wait.remove();
                addMessage('Ошибка соединения с сервером.', false);
                console.error("Ошибка:", e);
            }
        })
        .finally(() => {
            if (abortController !== null) {
                const stopBtn = document.getElementById('stopBtn');
                if (stopBtn) stopBtn.remove();

                btn.style.display = 'inline-block';
                btn.disabled = false;
                btn.textContent = 'Отправить';
                input.disabled = false;
                input.placeholder = 'Напиши свой вопрос...';
                input.focus();

                isProcessing = false;
                abortController = null;
            }
        });
    }

    btn.addEventListener('click', function(e) {
        e.preventDefault();
        sendQuestion();
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendQuestion();
        }
    });
    </script>
</body>
</html>
