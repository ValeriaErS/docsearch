corpus:
    path: "./docs"
    formats: ["md", "txt", "pdf", "html"]

chunking:
    max_tokens: 512
    overlap_tokens: 64

embeddings:
    provider: "local"
    model: "text-embedding-nomic-embed-text-v1.5"
    base_url: "http://127.0.0.1:1234"
    vector_size: 768

retrieval:
    top_k: 5
    min_score: 0.1
    enable_rewriting: true
    enable_hyde: false 
    hybrid_search: false  
    enable_rerank: false 
    enable_multi_query: false
    enable_compression: true
    enable_relevance_check: true

llm:
    provider: "openrouter"
    model: "openrouter/free"
    base_url: "https://openrouter.ai/api/v1"
    temperature: 0.1
    max_tokens: 2048

cache:
    enable_embedding_cache: true
    enable_search_cache: true
    ttl_hours: 24

validation:
    enable_citation_validator: true   
    remove_invalid_citations: true
    enable_hallucination_detection: true  
    warn_on_hallucination: true 

verification:
    enable_answer_verification: true

