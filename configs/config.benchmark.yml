corpus:
  path: "./docs"
  formats: ["md", "txt"]

chunking:
  max_tokens: 512
  overlap_tokens: 64

embeddings:
  provider: "local"         
  model: "text-embedding-nomic-embed-text-v1.5"
  base_url: "http://127.0.0.1:1234"
  vector_size: 768

retrieval:
  candidate_top_k: 50
  rerank_top_k: 10
  final_top_k: 5
  min_score: 0.0
  hybrid_search: true
  enable_rerank: true
  enable_rewriting: false
  enable_hyde: false
  enable_multi_query: false
  enable_compression: false
  enable_relevance_check: false

hybrid_weights:
  vector: 1.0
  text: 1.0

llm:
  provider: "mock"          
  model: "mock"
  base_url: ""
  temperature: 0.1
  max_tokens: 100

cache:
  enable_embedding_cache: true
  enable_search_cache: false
  ttl_hours: 24

validation:
  enable_citation_validator: false
  remove_invalid_citations: false
  enable_hallucination_detection: false
  warn_on_hallucination: false

verification:
  enable_answer_verification: false

rate_limit:
  enabled: false
  requests_per_minute: 30